[project]
name = "vidtoolz-loudness"
version = "0.1.0"
description = "Use EBU R128 Loudness Normalization with ffmpeg"
readme = "README.md"
authors = [{name = "Sukhbinder Singh"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "vidtoolz",
]

[project.urls]
Homepage = "https://github.com/sukhbinder/vidtoolz-loudness"
Changelog = "https://github.com/sukhbinder/vidtoolz-loudness/releases"
Issues = "https://github.com/sukhbinder/vidtoolz-loudness/issues"
CI = "https://github.com/sukhbinder/vidtoolz-loudness/actions"

[project.entry-points."vidtoolz_plugins"]
loudness = "vidtoolz_loudness:loudness_plugin"


[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
